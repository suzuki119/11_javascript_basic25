<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ミニクイズ</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            padding: 20px;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        #question {
            font-size: 1.2rem;
            margin: 15px 0;
            padding: 10px;
            background: #fff;
            border: 2px solid #ccc;
            border-radius: 6px;
        }

        #answer {
            padding: 8px;
            font-size: 1rem;
            width: 200px;
            margin-right: 8px;
        }

        #next {
            padding: 8px 16px;
            font-size: 1rem;
            background-color: #0078d7;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #next:hover {
            background-color: #005fa3;
        }

        #result {
            margin-top: 15px;
            font-weight: bold;
            color: #444;
        }
    </style>
</head>

<body>
    <h2>以下のクイズに答えてください。</h2>
    <p id="question"></p>
    <input type="text" id="answer" placeholder="答えを入力" />
    <button id="next">次へ</button>
    <p id="result"></p>
    <button id="showAll">解答を見る</button>
</body>


<script>
    //要素を取得し、変数に代入
    // 問題
    const questionElem = document.querySelector('#question');
    // 回答を入力するテキストフィールド
    const answerInput = document.querySelector('#answer');
    // 回答するボタン
    const respondBtn = document.querySelector('#next');
    // 正解・不正解の表示
    const resultMessage = document.querySelector('#result');

    // 問題3問
    const questions = [
        'トライデントコンピュータ専門学校の略称は？',
        '月に初めて着陸したロケット',
        '5-2は？'
    ];
    // 正解
    const answers = ['TSIT', 'アポロ11号', '3'];

    let index = 0;
    questionElem.textContent = questions[index]

    //回答
    respondBtn.addEventListener
        ('click', function () {
            const answer = answerInput.value;
            //formの値を取るなら.value
            console.log(answer);
            console.log('回答ボタンをクリック');
            if (answer === answers[index]) {
                resultMessage.textContent = '正解です';
            } else {
                resultMessage.textContent = '不正解です';
            }
            index++;
            answerInput.value = '';
            //初期化
            questionElem.textContent = questions[index];
        });



</script>

<script>

    // interestsの配列
    const interests = ['読書', '料理', 'キャンプ'];
    // 変数の確認
    console.log(interests);
    console.log(interests[0]);//読書
    console.log(interests[5]);//undefined

    interests[3] = 'げいむ';//['読書', '料理', 'キャンプ','げいむ'];

    //要素の数
    const count = interests.length;
    console.log(count);



</script>

<script>

    const price = 3000;

    if (price >= 5000) {
        console.log('送料無料');
    } else {
        console.log('送料800円');
    }

    console.log(Boolean(1));//true
    console.log(Boolean(0));//false
    console.log(Boolean('hello'));//true
    console.log(Boolean(''));//false
    console.log(Boolean(null));//false
    console.log(Boolean(undefined));//false


    console.log(1 == 1);//true
    console.log(1 == '1');//true!!
    console.log(1 === '1');//false!!今は===がデフォルト
</script>

</html>
