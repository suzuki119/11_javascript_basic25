<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>配列・条件分岐（if文）の振り返り</title>
</head>

<body>
    <button id="btn">クリック</button>
    <script>
        const hobbies = ['映画鑑賞', '読書', '旅行'];
    </script>


</body>

<script>
    var counter = 0;
    console.log(counter);

    const colors = ['赤', '青', '黄'];

    const blue = colors[1];

    if (blue === '青') {
        console.log("正解です");
    }
    else {
        console.log("不正解です");
    };

    console.log(blue);

    const pushBtn = document.querySelector('button#btn');

    pushBtn.addEventListener('click', function () {
        alert('押されました');
    });

    console.log(hobbies.length);
    if (hobbies.length === 3) {
        console.log("趣味が3つあります");
    } else {
        console.log("趣味が3つではありません");
    };

</script>

</html>
