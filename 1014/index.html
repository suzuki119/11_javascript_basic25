<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .buttons {
            text-align: center;
            margin-bottom: 20px;

            button {
                margin: 0 5px;
                padding: 8px 16px;
                border: none;
                background: #ccc;
                border-radius: 4px;
                cursor: pointer;

                &:hover {
                    background: #aaa;
                }

                &.active {
                    background: #333;
                    color: #fff;
                }
            }
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;

            img {
                width: 180px;
                height: 180px;
                object-fit: cover;
                border-radius: 6px;
                transition: opacity 0.3s;

                &:hover {
                    opacity: 0.8;
                }
            }
        }

        img {
            opacity: 0;
            transition: all 0.5s;
        }

        img.show {
            opacity: 1;
        }

        .gallery img.active {
            display: inline;
            width: 50%;
            height: auto;
        }

        .gallery img.hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="buttons">
        <button name="all">すべて</button>
        <button name="animal">動物</button>
        <button name="scenery">風景</button>
        <button name="food">食べ物</button>
    </div>

    <div class="gallery">
        <img src="https://2025doc.hideok.org/images/secondterm/js_images-001.png" alt="動物1" class="animal">
        <img src="https://2025doc.hideok.org/images/secondterm/js_images-002.png" alt="動物2" class="animal">
        <img src="https://2025doc.hideok.org/images/secondterm/js_images-003.png" alt="風景1" class="scenery">
        <img src="https://2025doc.hideok.org/images/secondterm/js_images-004.png" alt="風景2" class="scenery">
        <img src="https://2025doc.hideok.org/images/secondterm/js_images-005.png" alt="食べ物1" class="food">
    </div>


    <script>


        //① buttonと画像の要素を全て取得
        const buttons = document.querySelectorAll('button');
        const images = document.querySelectorAll(".gallery img");
        //Nodelistが作られる

        console.log(buttons);
        console.log(images);

        //② buttonsの各要素にイベント（ボタンをクリック）を設定

        buttons[0].addEventListener('click', function () {
            console.log('all');
        });
        buttons[1].addEventListener('click', function () {
            console.log('animal');
        });
        buttons[2].addEventListener('click', function () {
            console.log('scenery');
        });
        buttons[3].addEventListener('click', function () {
            console.log('food');
        });
        //配列buttonsを参照







        //buttonsのlength(長さ)は４なので４回繰り返す
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function () {
                //nameプロパティの参照
                console.log("buttonname=" + buttons[i].name);
                //③ for文で画像ファイルのclassを取得

                for (let j = 0; j < images.length; j++) {
                    //④ buttonのname属性とimgのclass属性で判定
                    if (buttons[i].name === "all") {
                        images[j].classList.remove('hidden');
                        images[j].classList.add('active');

                        //(buttons[i].name === images[j].className)
                    } else if (images[j].
                        //⑥ allの場合の判定を追加
                        classList.contains(buttons[i].name))
                        {
                        //⑤ classListオブジェクトでclassを操作
                        images[j].classList.add('active');
                        images[j].classList.remove('hidden');
                    } else {
                        images[j].classList.remove('active');
                        images[j].classList.add('hidden');
                    }
                }
            });
        }

        //読み込まれたら（イベントshow）
        //loadは画像や文章が読み込まれると発動する
        window.addEventListener('load', function () {
            for (let i = 0; i < images.length; i++) {

                setTimeout(function () {
                    images[i].classList.add('show');
                }, (i + 1) * 200); // i × 0.5秒ずつ遅らせて表示
            }
        })


    </script>
</body>

</html>
