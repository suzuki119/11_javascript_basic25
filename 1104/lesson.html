<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .title {
            color: #cd2d2d;
        }

        li.addclass_1 {
            color: #cd2d2d;
        }
    </style>
</head>

<body>
    <h1 class="title">title</h1>
    <h2 class="subtitle">sub</h2>
    <ul class="list">
        <li>1</li>
        <li class="addclass_1">2</li>
        <li>3</li>
        <li>4</li>
        <li>5</li>
    </ul>

    <button class="button">色を変える</button>

    <script>
        const subBtn = document.querySelector(".subtitle");
        subBtn.addEventListener("click", function () {
            alert('サブ');
        });

        const lists = document.querySelectorAll(".list li")
        console.log(lists)

        console.log(lists[2]);//3を取得

        if (lists[0] === 1) {
            console.log("true");
        } else {
            console.log("false");
        }

        const animals = ["うさぎ", "かめ", "いるか", "くま"];
        console.log(animals)
        for (let i = 0; i < animals.length; i++) {
            console.log(animals[i]);
        }

        for (let i = 0; i < lists.length; i++) {

            lists[i].addEventListener("click", function () {
                lists[i].classList.add("addclass");
                colorchange();
            });

        }

        const Btn = document.querySelector("button")

        Btn.addEventListener("click", function () {
            colorchange();
        });

        function colorchange() {
            lists[2].classList.add("addclass_1");
            lists[1].classList.remove("addclass_1");

        }


    </script>

</body>

</html>
