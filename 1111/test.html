<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Box</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .box {
            width: 200px;
            height: 200px;
            background-color: #333;
        }

        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            gap: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .buttons button:hover {
            background-color: #ddd;
        }

        /* 必要であれば、追記します。 */
        .box.red {
            background-color: red;
        }

        .box.blue {
            background-color: blue;
        }

        .box.green {
            background-color: green;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
        <div class="buttons">
            <button>Red</button>
            <button>Green</button>
            <button>Blue</button>
        </div>
    </div>
</body>
<script>
    // JavaScriptはここに書きます。

    const colorbox = document.querySelector(".box");
    console.log(colorbox);



    const colorbuttons = document.querySelectorAll(".buttons button");
    console.log(colorbuttons);

    function colorchange(num) {
        console.log("click");
        colorbox.classList.remove("red");
        colorbox.classList.remove("blue");
        colorbox.classList.remove("green");

        if (num === 0) {
            colorbox.classList.add("red");
        } else if (num === 1) {
            colorbox.classList.add("green");
        } else {
            colorbox.classList.add("blue");
        }
    }

    for (let i = 0; i < colorbuttons.length; i++) {
        colorbuttons[i].addEventListener("click", function () {
            colorchange(i);
        });
    }



</script>

</html>
