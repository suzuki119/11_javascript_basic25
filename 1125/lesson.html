<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: radial-gradient(#2b1055, #000);
            color: #fff;
            font-family: serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        h1,
        h2 {
            color: #ffd700;
            text-shadow: 0 0 10px #ffd700;
        }

        #btn {
            background: linear-gradient(135deg, #ffd700, #ffa500);
            border: none;
            padding: 10px 30px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        #btn:hover {
            transform: scale(1.05);
        }

        #result {
            opacity: 0;
            transition: 0.5s;
            margin-top: 20px;
        }

        #result.show {
            opacity: 1;
        }
    </style>
</head>

<body>
    <button id="btn">占う</button>

    <div id="result"></div>

    <script>
        // 配列リテラル
        const luckList = ["大吉", "中吉", "小吉", "凶"];

        // ラッキーカラー
        const colorList = ["red", "blue", "green", "yellow"];

        // ラッキーアイテム
        const items = ["お守り", "ノート", "スマホ", "コーヒー"];

        //キーが文字なら自動で文字列に
        const messages = {
            大吉: "今日は最高の日になりそう！",
            中吉: "穏やかに過ごせる一日です。",
            小吉: "小さな幸せを見つけよう。",
            凶: ""
        };

        const thisresult = document.querySelector("#result");

        // 引数(array)と戻り値(retuen{})を利用する関数
        const getRandomElement = function (array) {
            return array[Math.floor(Math.random() * array.length)];
        };

        const getFortune = function () {
            const luck = getRandomElement(luckList);
            const color = getRandomElement(colorList);
            const item = getRandomElement(items);
            const number = Math.floor(Math.random() * 10) + 1; // 数値リテラル

            return {
                luck: luck,
                color: color,
                item: item,
                number: number,
                message: messages[luck]
            };
        };
        const resultObj = getFortune(); // 関数式を実行
        console.log(resultObj.luck, resultObj.color, resultObj);

        btn.addEventListener("click", function () {
            console.log("クリック");
            const resultObj = getFortune(); // 関数式を実行
            console.log(resultObj);

            let message = resultObj.message;//(あとで再代入するのでlet)
            if (!message) {
                message = "メッセージなし";
            }

            thisresult.innerHTML =
                `
    <h2>${resultObj.luck}</h2>
    <p>ラッキーナンバー：${resultObj.number}</p>
    <p>ラッキーカラー：${resultObj.color}</p>
    <p>アイテム：${resultObj.item}</p>
    <p>${message}</p>
    `;
            //$で変数として確定させる,(``)が必要

            thisresult.classList.add("show"); // アニメーション
        });
    </script>
</body>

</html>
