<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12星座</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/the-new-css-reset/css/reset.min.css">

    <style>
        #slot-result {
            width: 100%;
            text-align: start;
            align-content: center;
            display: grid;
            height: 400px;
            transition: 0.5s;
            border: #fff 2px solid;
            border-radius: 15px;
            padding: 30px 0;
            font-size: 64px;
            margin-bottom: 20px;
            padding: 30px;
        }

        .slot {
            width: 80px;
            height: 80px;
            background: #000;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #fff;
            border-radius: 10px;
        }

        .resultlist {
            display: grid;
            grid-auto-flow: column;
            justify-content: space-between;
        }

        @keyframes spin {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-100%);
            }
        }

        .slot.spinning {
            animation: spin 0.1s linear infinite;
        }

        button {
            padding: 10px 30px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="inner">

        <div id="slot-result">

        </div>
        <div class="slotlist">
            <button id="startBtn">スタート</button>
            <button class="stopBtn" data-index="0">止める①</button>
            <button class="stopBtn" data-index="1">止める②</button>
            <button class="stopBtn" data-index="2">止める③</button>
        </div>
    </div>



    <script>
        const slotResult = document.getElementById("slot-result");
        const startButton = document.getElementById("startBtn");
        const stopButtons = document.querySelectorAll(".stopBtn");

        const symbols = ["🍒", "🍋", "🔔", "⭐", "🍉", "7️⃣"];

        // 初期表示
        function init() {
            slotResult.innerHTML = `
            <div class="resultlist">
            <div class="slot">？</div>
            <div class="slot">？</div>
            <div class="slot">？</div>
            </div>
        `;
        }

        init();

        let timers = [null, null, null];
        let indexes = [0, 0, 0];
        let isSpinning = false;

        // スタート
        startButton.addEventListener("click", () => {
            if (isSpinning) return;
            isSpinning = true;

            const slots = document.querySelectorAll(".slot");

            for (let i = 0; i < 3; i++) {
                slots[i].classList.add("spinning");

                timers[i] = setInterval(() => {
                    slots[i].textContent = symbols[indexes[i] % symbols.length];
                    indexes[i]++;
                }, 200);
            }
        });

        // ストップ（目押し）
        stopButtons.forEach(btn => {
            btn.addEventListener("click", () => {
                const i = btn.dataset.index;
                const slots = document.querySelectorAll(".slot");

                if (!timers[i]) return;

                clearInterval(timers[i]);
                timers[i] = null;
                slots[i].classList.remove("spinning");

                // 全部止まったらリセット可能に
                if (timers.every(t => t === null)) {
                    isSpinning = false;
                }
            });
        });
    </script>
</body>

</html>
