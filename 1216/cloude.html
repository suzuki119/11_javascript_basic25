<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


    </style>
</head>

<body>
    <h1>to Scroll</h1>

    <script>

        function syncAlert() {
            alert('Hello');
            console.log('アラートを表示');
        }
        syncAlert();
        //同期

        function asyncAlert() {
            setTimeout(function () {
                alert('アラートを表示');
            }, 0);
            console.log('ログを出力');
        }
        asyncAlert();
        //非同期


    </script>
</body>

</html>
