        }
        //console.log(j);<ブロックスコープの呼び出しでエラーになる

        if (true) {
            console.log(k); //<グローバルスコープなので、外側から参照できるが予期せぬバグも起こりやすい
        }

        const obj = {
            name: "太郎",
            age: 20,


            //メソッド=関数式
            greet: function () {
                //thisはオブジェクト自身の中にあるプロパティを参照する
                console.log(`こんにちは、${this.name}です。年齢は${this.age}歳です。`);
                //${}を使うのでテンプレートリテラル（バッククォート `` を使う）
            }

        };

        obj.name = "次郎";//プロパティの書き換え

        obj.greet();//関数実行（呼び出し）
        //console.log();もメソッド
        // （windowオブジェクト　+ 組み込み関数）


        const interests = ['読書', '料理', 'キャンプ'];
        const count = interests.length;
        console.log(count); //.lengthは配列の要素数を返す
        interests.push('散歩');
        console.log(interests); //['読書', '料理', 'キャンプ', '散歩']（pushで配列の末尾に要素を追加）
        interests.pop();
        console.log(interests); //['読書', '料理', 'キャンプ']（popで配列の末尾の要素を取り出す）

        const nodes = document.querySelectorAll('div');
        console.log(nodes); //NodeList(3)
        //nodes.push('新しい要素'); 使えない
        //使うためには、配列に変換してから使う必要がある。
        const array = Array.from(nodes);
        array.push('新しい要素');
